<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kitchen{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/menu" class="brand"><strong>Kitchen</strong></a></li></ul>
      <ul class="nav-links">
        <li><a href="/menu">Menu</a></li>
        <li><a href="/dishes">Recipes</a></li>
        <li><a href="/shopping">Shopping</a></li>
        <li><a href="/imports">Import{% set n = drafts_count() %}{% if n %} <span class="badge">{{ n }}</span>{% endif %}</a></li>
        <li><a href="/tags">Tags</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if flash %}<p class="flash">{{ flash }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
