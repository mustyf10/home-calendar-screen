name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Server tests
        run: pip install -r server/requirements-dev.txt && cd server && pytest -q

      - name: Display client tests
        run: python -m pytest -q display-client

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/mustyf10/home-calendar-screen:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/mustyf10/home-calendar-screen
