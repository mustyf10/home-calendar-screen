services:
  home-calendar:
    image: ghcr.io/mustyf10/home-calendar-screen:v0.3.0
    container_name: home-calendar
    init: true
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/London}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-5-5}
    ports:
      - "8000:8000"   # no login: keep this on a private network
    volumes:
      - ./data:/data
      - ./backups:/backups
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
